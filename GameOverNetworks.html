<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Over - Networks</title>
    <link rel="icon" type="image/webp" href="assets/MMLogo.webp">
    <link rel="stylesheet" href="results.css">
    <style>
      @media screen and (max-width: 1024px) and (orientation: portrait) {
        body { overflow-y: auto; }
        .result-card { display: block !important; width: 92vw; padding: 2rem 1.2rem; max-height: 92vh; overflow-y: auto; margin: auto; }
        h1 { font-size: clamp(1.6rem, 8vw, 2.4rem); letter-spacing: 2px; }
        h2 { font-size: 1rem; letter-spacing: 2px; margin-bottom: 1.5rem; }
        p { font-size: 0.95rem; line-height: 1.5; }
        .stats-grid { gap: 1.5rem; margin: 1.2rem 0; padding: 0.8rem; }
        .stat-value { font-size: 1.3rem; }
        .action-buttons { flex-direction: column; gap: 0.8rem; margin-top: 1.5rem; }
        .cyber-btn { width: 100%; padding: 14px; font-size: 0.9rem; letter-spacing: 2px; }
      }
    </style>
</head>

<body class="failure-bg">
    <div class="result-card failure-theme">
        <h1>Game Over</h1>
        <h2>Breach Detected</h2>

        <div class="lesson-box"
            style="border-left-color: var(--neon-red); background: linear-gradient(90deg, rgba(255,0,60,0.05) 0%, transparent 100%);">
            <p style="color: #ffb3b3; margin: 0;">The target system identified your intrusion signature. Connection
                terminated, Mission Failed. Be quicker next time.</p>
        </div>

        <div class="action-buttons">
            <button type="button" class="cyber-btn btn-red" onclick="tryAgain()">Try Again</button>
            <button type="button" class="cyber-btn btn-red" onclick="quit()">Quit to Menu</button>
        </div>
    </div>

    <script>
        // Background Music
        let bgMusic = null;
        if (localStorage.getItem("audioUnlocked") === "true") {
            const introSFX = new Audio("assets/cyber-punk-95771-(GameOver).mp3");
            introSFX.volume = 0.5;
            introSFX.play().catch(() => { });

            bgMusic = new Audio("assets/00_Six Two Remastered.wav");
            bgMusic.loop = true;
            bgMusic.volume = 0.05;
            bgMusic.preload = "auto";
            bgMusic.play().catch(() => { });
        }

        function tryAgain() {
            window.location.href = 'networks.html';
        }

        function quit() {
            window.location.href = 'LevelSelect.html';
        }
    </script>
</body>

</html>
